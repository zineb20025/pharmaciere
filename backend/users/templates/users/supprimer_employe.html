{% extends 'products/base.html' %}

{% block title %}Supprimer un Employé - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center border-danger">
            <h2 class="fw-bold text-danger mb-3">🗑️ Confirmer la Suppression</h2>
            <p class="fs-5">Voulez-vous vraiment supprimer l'employé <strong>{{ employe.username }}</strong> ?</p>
            <p class="text-muted">Cette action est irréversible.</p>

            <form method="post" class="mt-4">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'liste_employes' %}" class="btn btn-outline-secondary">← Annuler</a>
                    <button type="submit" class="btn btn-danger">🗑️ Oui, Supprimer</button>
                </div>
            </form>
        </div>
</div>
{% endblock %}
